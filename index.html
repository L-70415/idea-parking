<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>想法停车场</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 头部 -->
<header class="topbar">
  <div class="brand">🚗 想法停车场</div>
  <div class="count" id="count">0 条</div>
</header>

<!-- 输入区 -->
<main>
  <div class="input-zone" id="inputZone">
    <textarea id="ideaInput" placeholder="想到什么，写一句话。就一句话。" rows="1" autofocus></textarea>
    <button id="parkBtn" class="park-btn">停车</button>
  </div>

  <!-- 关联选择区（提交后出现，扫一眼用） -->
  <div class="link-zone hidden" id="linkZone">
    <div class="hint">👀 扫一眼，和哪条有关系？（可选）</div>
    <div class="link-list" id="linkList"></div>
    <div class="link-actions">
      <button id="confirmLink" class="primary">就这些</button>
      <button id="skipLink" class="ghost">不关联，继续</button>
    </div>
  </div>

  <!-- 已停车列表 -->
  <section class="list-section">
    <div class="section-header">
      <span>已停车的想法</span>
      <button id="exportBtn" class="small-btn">导出备份</button>
      <button id="importBtn" class="small-btn">导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
      <button id="installBtn" class="small-btn hidden">📲 安装为App</button>
    </div>
    <div id="ideaList" class="idea-list"></div>
    <div id="emptyTip" class="empty-tip">空空如也。想到什么就写一句话吧。</div>
  </section>
</main>

<!-- 底部 -->
<footer class="bottombar">
  <span>💡 写完就好，展开是以后的事</span>
</footer>

<!-- 查看想法详情浮层 -->
<div id="detailModal" class="modal hidden">
  <div class="modal-backdrop" id="modalClose"></div>
  <div class="modal-card">
    <div class="modal-header">
      <span id="detailId">#0</span>
      <button class="modal-close" id="modalCloseBtn">✕</button>
    </div>
    <div class="modal-body" id="detailContent"></div>
    <div class="modal-links" id="detailLinks"></div>
    <div class="modal-footer">
      <button id="modalJump" class="primary">跳到这条</button>
    </div>
  </div>
</div>

<!-- 安装提示弹窗 -->
<div id="installHint" class="hidden" style="position:fixed;bottom:20px;left:20px;right:20px;background:#16213e;border:1px solid #e94560;border-radius:12px;padding:16px;z-index:9999;">
  <div style="font-size:14px;color:#eaeaea;margin-bottom:10px;">
    这个网站支持安装为独立App，有桌面图标、离线能用。
  </div>
  <div style="font-size:12px;color:#a8a8b3;margin-bottom:12px;">
    点Chrome菜单(三个点) → "添加到主屏幕" 或 "安装应用"
  </div>
  <button id="closeInstallHint" style="width:100%;padding:10px;background:#e94560;color:white;border:none;border-radius:8px;font-size:14px;">知道了</button>
</div>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
</body>
</html>
